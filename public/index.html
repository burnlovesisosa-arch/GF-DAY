        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            background-color: #ffb6c1;
            font-family: 'Montserrat', sans-serif;
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at center, #ffe6f0 0%, #ff85a2 40%, #a01a58 100%);
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.8) 2px, transparent 4px),
                radial-gradient(white, rgba(255,192,203,.6) 1px, transparent 3px);
            background-size: 400px 400px, 250px 250px;
            animation: twinkle 30s linear infinite;
            opacity: 0.8;
        }

        @keyframes twinkle {
            from { transform: translateY(0); }
            to { transform: translateY(-400px); }
        }

        .rain-item {
            position: absolute;
            top: -50px;
            z-index: 2;
            user-select: none;
            pointer-events: none;
            animation: fallRain linear infinite;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
        }

        @keyframes fallRain {
            0% {
                transform: translateY(-50px) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0.2;
            }
        }

        .butterfly {
            position: absolute;
            font-size: 26px;
            z-index: 25;
            user-select: none;
            pointer-events: none;
            animation: flyButterfly 10s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 1));
        }

        @keyframes flyButterfly {
            0% { transform: translate(-10vw, 70vh) scale(0.8) rotate(15deg); }
            25% { transform: translate(30vw, 20vh) scale(1.2) rotate(-25deg); }
            50% { transform: translate(60vw, 35vh) scale(0.9) rotate(15deg); }
            75% { transform: translate(85vw, 15vh) scale(1.1) rotate(-15deg); }
            100% { transform: translate(110vw, 55vh) scale(0.8) rotate(30deg); }
        }

        .butterfly-2 { animation-duration: 13s; animation-delay: -2s; }
        .butterfly-3 { animation-duration: 9s; animation-delay: -4s; }
        .butterfly-4 { animation-duration: 11s; animation-delay: -6s; }

        .top-title {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 95%;
            max-width: 750px;
        }

        .script-font {
            font-family: 'Great Vibes', cursive;
            letter-spacing: 3px;
        }

        h1 {
            color: #ffffff;
            font-size: 3.4rem;
            font-weight: 400;
            text-shadow: 0 0 30px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 20, 147, 1), 0 0 5px rgba(139, 0, 66, 1);
            animation: titlePulse 2s ease-in-out infinite alternate;
        }

        @keyframes titlePulse {
            0% { transform: scale(1) rotate(-1deg); text-shadow: 0 0 20px rgba(255, 255, 255, 0.9); }
            100% { transform: scale(1.05) rotate(1deg); text-shadow: 0 0 40px rgba(255, 20, 147, 1), 0 0 10px rgba(255, 255, 255, 1); }
        }

        .note-box-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 440px;
            background: rgba(255, 240, 245, 0.95);
            backdrop-filter: blur(15px);
            border: 4px solid #ffffff;
            border-radius: 30px;
            padding: 35px 25px;
            text-align: center;
            z-index: 10;
            animation: boxFloat 3s ease-in-out infinite alternate, rainbowBorder 5s linear infinite;
            transition: opacity 0.8s ease, transform 0.8s ease;
            box-shadow: 0 20px 40px rgba(139, 0, 66, 0.6), inset 0 0 20px rgba(255, 182, 193, 0.8);
        }

        @keyframes boxFloat {
            0% { transform: translate(-50%, -50%) translateY(0); }
            100% { transform: translate(-50%, -50%) translateY(-15px); }
        }

        @keyframes rainbowBorder {
            0% { border-color: #ffffff; box-shadow: 0 0 30px rgba(255,255,255,1), inset 0 0 20px rgba(255,192,203,0.9); }
            33% { border-color: #ff1493; box-shadow: 0 0 30px rgba(255,20,147,1), inset 0 0 20px rgba(255,20,147,0.9); }
            66% { border-color: #ff69b4; box-shadow: 0 0 30px rgba(255,105,180,1), inset 0 0 20px rgba(255,105,180,0.9); }
            100% { border-color: #ffffff; box-shadow: 0 0 30px rgba(255,255,255,1), inset 0 0 20px rgba(255,192,203,0.9); }
        }

        .note-box-container p {
            color: #5a0f35;
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.7;
            margin-bottom: 16px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            color: #b30059;
            font-size: 1.8rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1);
            font-weight: 700;
        }

        .open-btn {
            background: linear-gradient(135deg, #ff1493, #ff69b4, #ff007f);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 3px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 20, 147, 1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: btnGlow 1.5s ease-in-out infinite alternate;
        }

        @keyframes btnGlow {
            0% { box-shadow: 0 0 15px rgba(255, 20, 147, 0.7), inset 0 0 10px rgba(255,255,255,0.5); }
            100% { box-shadow: 0 0 35px rgba(255, 20, 147, 1), inset 0 0 20px rgba(255,255,255,0.9); }
        }

        .open-btn:active {
            transform: scale(0.92);
        }

        .garden-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .garden-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        .realistic-flower {
            position: absolute;
            bottom: 25px;
            transform-origin: bottom center;
            animation: flowerWind 3.5s ease-in-out infinite alternate;
        }

        @keyframes flowerWind {
            0% { transform: rotate(-4deg); }
            100% { transform: rotate(4deg); }
        }

        .r-stem {
            position: absolute;
            width: 5px;
            background: linear-gradient(to top, #081c15, #1b4332, #52b788);
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
            box-shadow: 0 0 8px rgba(0,0,0,0.4);
        }

        .r-bloom {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
        }

        .r-petal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 26px;
            height: 48px;
            border-radius: 50%;
            transform-origin: bottom center;
            opacity: 0;
            clip-path: circle(0% at 50% 100%);
            animation: realisticBloom 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-play-state: paused;
            box-shadow: 0 0 12px rgba(255,255,255,0.7);
        }

        .garden-container.active .r-petal {
            animation-play-state: running;
        }

        @keyframes realisticBloom {
            to {
                opacity: 0.98;
                clip-path: circle(100% at 50% 50%);
            }
        }

        .r-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ffffff, #ffea00, #ff8500);

            box-shadow: 0 0 15px #ffea00, inset 0 0 5px #ffffff;

    <script>
        function createRainingItem() {
            const rain = document.createElement('div');
            rain.classList.add('rain-item');
            
            const symbols = ['🌸', '💖', '✨', '🌷', '💕', '🌹', '🌻', '💫', '🤍'];
            rain.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            
            rain.style.left = Math.random() * 100 + 'vw';
            rain.style.animationDuration = (Math.random() * 3 + 3) + 's';
            rain.style.fontSize = (Math.random() * 14 + 16) + 'px';
            
            document.body.appendChild(rain);
            
            setTimeout(() => {
                rain.remove();
            }, 7000);
        }

        setInterval(createRainingItem, 150);

        function openSurprise() {
            const noteBox = document.getElementById('noteBox');
            const gardenContainer = document.getElementById('gardenContainer');
            const bgMusic = document.getElementById('bgMusic');
            
            bgMusic.play().catch(error => {
                console.log("Audio playback failed:", error);
            });
            
            noteBox.classList.add('fade-out');
            
            setTimeout(() => {
                noteBox.style.display = 'none';
            }, 800);
            
            gardenContainer.classList.add('active');
        }
    </script>
