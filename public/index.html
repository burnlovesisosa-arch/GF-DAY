<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Shanti - Sosa</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            background-color: #ffb6c1;
            font-family: 'Montserrat', sans-serif;
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at center, #ffe6f0 0%, #ff85a2 40%, #a01a58 100%);
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.8) 2px, transparent 4px),
                radial-gradient(white, rgba(255,192,203,.6) 1px, transparent 3px);
            background-size: 400px 400px, 250px 250px;
            animation: twinkle 30s linear infinite;
            opacity: 0.8;
        }

        @keyframes twinkle {
            from { transform: translateY(0); }
            to { transform: translateY(-400px); }
        }

        .rain-item {
            position: absolute;
            top: -50px;
            z-index: 2;
            user-select: none;
            pointer-events: none;
            animation: fallRain linear infinite;
        }

        @keyframes fallRain {
            0% {
                transform: translateY(-50px) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0.2;
            }
        }

        .butterfly {
            position: absolute;
            font-size: 26px;
            z-index: 25;
            user-select: none;
            pointer-events: none;
            animation: flyButterfly 10s ease-in-out infinite;
        }

        @keyframes flyButterfly {
            0% { transform: translate(-10vw, 70vh) scale(0.8) rotate(15deg); }
            25% { transform: translate(30vw, 20vh) scale(1.2) rotate(-25deg); }
            50% { transform: translate(60vw, 35vh) scale(0.9) rotate(15deg); }
            75% { transform: translate(85vw, 15vh) scale(1.1) rotate(-15deg); }
            100% { transform: translate(110vw, 55vh) scale(0.8) rotate(30deg); }
        }

        .butterfly-2 { animation-duration: 13s; animation-delay: -2s; }
        .butterfly-3 { animation-duration: 9s; animation-delay: -4s; }
        .butterfly-4 { animation-duration: 11s; animation-delay: -6s; }

        .top-title {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 95%;
            max-width: 750px;
        }

        .fancy-font {
            font-family: 'Cinzel Decorative', cursive;
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 2px 15px rgba(139, 0, 66, 0.6);
            animation: titlePulse 2s ease-in-out infinite alternate;
        }

        @keyframes titlePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        .note-box-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 440px;
            background: rgba(255, 240, 245, 0.95);
            border: 3px solid #ffffff;
            border-radius: 30px;
            padding: 35px 25px;
            text-align: center;
            z-index: 10;
            animation: boxFloat 3s ease-in-out infinite alternate;
            transition: opacity 0.5s ease, transform 0.5s ease;
            box-shadow: 0 15px 30px rgba(139, 0, 66, 0.3);
        }

        @keyframes boxFloat {
            0% { transform: translate(-50%, -50%) translateY(0); }
            100% { transform: translate(-50%, -50%) translateY(-10px); }
        }

        .note-box-container p {
            color: #5a0f35;
            font-size: 1.05rem;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .signature {
            font-family: 'Cinzel Decorative', cursive;
            color: #b30059;
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .open-btn {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            letter-spacing: 2px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 20, 147, 0.5);
            transition: transform 0.2s ease;
        }

        .open-btn:active {
            transform: scale(0.92);
        }

        .garden-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .garden-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        .realistic-flower {
            position: absolute;
            bottom: 25px;
            transform-origin: bottom center;
            animation: swayFlower 3.5s ease-in-out infinite alternate;
        }

        .flower-1  { left: 4%;  height: 180px; animation-duration: 3s; }
        .flower-2  { left: 12%; height: 230px; animation-duration: 4s; animation-delay: -1s; }
        .flower-3  { left: 20%; height: 280px; animation-duration: 3.5s; animation-delay: -0.5s; }
        .flower-4  { left: 28%; height: 320px; animation-duration: 4.5s; animation-delay: -2s; }
        .flower-5  { left: 36%; height: 350px; animation-duration: 3.2s; animation-delay: -1.5s; }
        .flower-6  { left: 44%; height: 380px; animation-duration: 3.8s; animation-delay: -0.8s; }
        .flower-7  { left: 52%; height: 380px; animation-duration: 4.2s; animation-delay: -1.2s; }
        .flower-8  { left: 60%; height: 350px; animation-duration: 3.6s; animation-delay: -0.3s; }
        .flower-9  { left: 68%; height: 320px; animation-duration: 3.9s; animation-delay: -1.7s; }
        .flower-10 { left: 76%; height: 280px; animation-duration: 3.3s; animation-delay: -0.7s; }
        .flower-11 { left: 84%; height: 230px; animation-duration: 4.1s; animation-delay: -1.4s; }
        .flower-12 { left: 92%; height: 180px; animation-duration: 3.7s; animation-delay: -0.4s; }

        @keyframes swayFlower {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }

        .r-stem {
            position: absolute;
            width: 4px;
            background: linear-gradient(to top, #1b4332, #52b788);
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .r-bloom {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
        }

        .r-petal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 40px;
            border-radius: 50%;
            transform-origin: bottom center;
            opacity: 0.9;
        }

        .r-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background: #ffea00;
            border-radius: 50%;
            z-index: 10;
        }

        .flower-1  .r-stem { height: 180px; }
        .flower-1  .r-petal { background: #ff007f; }

        .flower-2  .r-stem { height: 230px; }
        .flower-2  .r-petal { background: #9b5de5; }

        .flower-3  .r-stem { height: 280px; }
        .flower-3  .r-petal { background: #ff4d6d; }

        .flower-4  .r-stem { height: 320px; }
        .flower-4  .r-petal { background: #c9184a; }

        .flower-5  .r-stem { height: 350px; }
        .flower-5  .r-petal { background: #ff70a6; }

        .flower-6  .r-stem { height: 380px; }
        .flower-6  .r-petal { background: #fb8500; }

        .flower-7  .r-stem { height: 380px; }
        .flower-7  .r-petal { background: #ff0054; }

        .flower-8  .r-stem { height: 350px; }
        .flower-8  .r-petal { background: #00bbf9; }

        .flower-9  .r-stem { height: 320px; }
        .flower-9  .r-petal { background: #7209b7; }

        .flower-10 .r-stem { height: 280px; }
        .flower-10 .r-petal { background: #ff99c8; }

        .flower-11 .r-stem { height: 230px; }
        .flower-11 .r-petal { background: #3a86ff; }

        .flower-12 .r-stem { height: 180px; }
        .flower-12 .r-petal { background: #ff758f; }

        .mid-flowers {
            position: absolute;
            bottom: 110px;
            left: 0;
            width: 100%;
            height: 100px;
            z-index: 19;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .garden-container.active .mid-flowers {
            opacity: 1;
        }

        .mid-item {
            position: relative;
            font-size: 24px;
            animation: swayFlower 2.5s ease-in-out infinite alternate;
        }

        .grass-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            z-index: 20;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .garden-container.active .grass-layer {
            opacity: 1;
        }

        .g-blade {
            position: relative;
            width: 8px;
            height: 50px;
            background: #2d6a4f;
            border-radius: 50% 50% 0 0;
            transform-origin: bottom center;
            animation: swayFlower 2s ease-in-out infinite alternate;
        }

        .fade-out {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translate(-50%, -40%) scale(0.9) !important;
        }
    </style>
</head>

    <script>
        function createRainingItem() {
            const rain = document.createElement('div');
            rain.classList.add('rain-item');
            
            const symbols = ['🌸', '💖', '✨', '🌷', '💕'];
            rain.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            
            rain.style.left = Math.random() * 100 + 'vw';
            rain.style.animationDuration = (Math.random() * 3 + 3) + 's';
            rain.style.fontSize = (Math.random() * 10 + 14) + 'px';
            
            document.body.appendChild(rain);
            
            setTimeout(() => {
                rain.remove();
            }, 6000);
        }

        setInterval(createRainingItem, 300);

        function openSurprise() {
            const noteBox = document.getElementById('noteBox');
            const gardenContainer = document.getElementById('gardenContainer');
            const bgMusic = document.getElementById('bgMusic');
            
            bgMusic.play().catch(error => {
                console.log("Audio playback failed:", error);
            });
            
            noteBox.classList.add('fade-out');
            
            setTimeout(() => {
                noteBox.style.display = 'none';
            }, 500);
            
            gardenContainer.classList.add('active');
        }
    </script>
